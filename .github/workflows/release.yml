name: Build and release LINK4BRICK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install verification dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev python3-pil
      - name: Fetch pinned Link and menu assets
        run: |
          git clone https://github.com/Ableton/link.git link
          git -C link checkout 902aef95bf94af49746fdda5369b42cdcfa1e6d2
          git -C link submodule update --init --recursive
          python3 tools/prepare_link.py link
          python3 tools/make_ui_assets.py
      - name: Verify audio routing, settings and live Link
        run: |
          cc -std=c11 -D_POSIX_C_SOURCE=200809L -Wall -Wextra -Werror tests/clock_test.c -lm -o clock-test
          ./clock-test
          c++ -std=c++17 -Wall -Wextra -Werror tests/pcm_timeline_test.cpp -o pcm-timeline-test
          ./pcm-timeline-test
          cmake -S . -B host-build -DLINK_DIR="$PWD/link" -DAUDIOCAST_CLOCK_TESTS=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build host-build -j2
          python3 tools/verify.py --build host-build
          python3 tests/settings_test.py host-build
          python3 tests/virtual_cable_launcher_test.py
          python3 tests/clock_only_test.py host-build
          python3 tests/clock_only_test.py host-build --peer-first
          python3 tests/clock_only_path_test.py host-build
          python3 tests/sender_clock_test.py host-build
          python3 tests/sender_audio_test.py host-build
          for script in Apps/LINK4BRICK/*.sh Apps/LINK4BRICK/cable/*.sh; do sh -n "$script"; done
      - name: Verify GBA core timing and fixed-rate audio
        run: |
          python3 tools/prepare_mgba.py mgba
          cmake -S mgba -B mgba-build -C sync/mgba-options.cmake -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build mgba-build -j2
          python3 tools/build_probe.py mgba-build --synthetic --output core-clock-test
          ./core-clock-test
          python3 tools/build_probe.py mgba-build --serial --output serial-clock-test
          ./serial-clock-test
          ./serial-clock-test 65000
          ./serial-clock-test 150000
          python3 tools/build_probe.py mgba-build --stepper --output stepper-clock-test
          timeout 60 ./stepper-clock-test
          python3 tools/build_probe.py mgba-build --audio --output audio-rate-test
          ./audio-rate-test
          cc -std=gnu11 -D_POSIX_C_SOURCE=200809L -I mgba/src/platform/libretro tests/libretro_lifecycle.c -ldl -o libretro-lifecycle
          ./host-build/audiocast-core-probe mgba-build/mgba_libretro.so
          ./libretro-lifecycle mgba-build/mgba_libretro.so
      - name: Verify reversible Terminal installer
        run: python3 tests/installer_test.py
  build:
    needs: verify
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/loveretro/tg5040-toolchain:latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned sources and generate menu assets
        run: |
          apt-get update && apt-get install -y python3-pil qemu-user zip unzip
          git clone https://github.com/Ableton/link.git link
          git -C link checkout 902aef95bf94af49746fdda5369b42cdcfa1e6d2
          git -C link submodule update --init --recursive
          python3 tools/prepare_link.py link
          python3 tools/prepare_mgba.py mgba
          python3 tools/make_ui_assets.py
      - name: Build ARM64 app and private core
        run: |
          cmake -S . -B build -DLINK_DIR="$PWD/link" -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=/opt/aarch64-nextui-linux-gnu/bin/aarch64-nextui-linux-gnu-g++
          cmake --build build -j2
          cmake -S mgba -B mgba-build -C sync/mgba-options.cmake \
            -DCMAKE_SYSTEM_NAME=Linux -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_C_COMPILER=/opt/aarch64-nextui-linux-gnu/bin/aarch64-nextui-linux-gnu-gcc \
            -DCMAKE_CXX_COMPILER=/opt/aarch64-nextui-linux-gnu/bin/aarch64-nextui-linux-gnu-g++
          cmake --build mgba-build -j2
      - name: Verify ARM64 menu, core loading and frame execution
        run: |
          /opt/aarch64-nextui-linux-gnu/bin/aarch64-nextui-linux-gnu-gcc \
            -std=gnu11 -D_POSIX_C_SOURCE=200809L -I mgba/src/platform/libretro \
            tests/libretro_lifecycle.c -ldl -o build/libretro-lifecycle
          L4B_SYSROOT=$(/opt/aarch64-nextui-linux-gnu/bin/aarch64-nextui-linux-gnu-gcc -print-sysroot)
          (cd Apps/LINK4BRICK && qemu-aarch64 -cpu cortex-a53 -L "$L4B_SYSROOT" ../../build/audiocast-settings --render /tmp/link4brick-menu.ppm)
          env -u AUDIOCAST_CLOCK_SOCKET qemu-aarch64 -cpu cortex-a53 -L "$L4B_SYSROOT" build/linkclock-send
          qemu-aarch64 -cpu cortex-a53 -L "$L4B_SYSROOT" build/audiocast-core-probe mgba-build/mgba_libretro.so
          qemu-aarch64 -cpu cortex-a53 -L "$L4B_SYSROOT" build/libretro-lifecycle mgba-build/mgba_libretro.so
      - name: Package verified StockUI app and corresponding source
        run: |
          python3 tools/package_virtual_cable.py --build build --core mgba-build/mgba_libretro.so \
            --link link --output dist/LINK4BRICK-StockUI-v1.0.1.zip
          unzip -t dist/LINK4BRICK-StockUI-v1.0.1.zip
          mkdir -p source
          git -c safe.directory="$PWD" archive HEAD | tar -x -C source
          cp -a link mgba assets source/
          cp -a Apps/LINK4BRICK/ui source/Apps/LINK4BRICK/
          cp src/ui_font.h source/src/ui_font.h
          tar --exclude='*/.git' --exclude='./mgba/cinema' --exclude='*.log' --exclude='*.gba' --exclude='*.gb' --exclude='*.sav' --exclude='*.srm' --exclude='*.pak' -czf dist/LINK4BRICK-v1.0.1-source.tar.gz -C source .
          cp tools/install.py dist/install_link4brick.py
          cd dist
          sha256sum LINK4BRICK-StockUI-v1.0.1.zip LINK4BRICK-v1.0.1-source.tar.gz install_link4brick.py > SHA256SUMS
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: LINK4BRICK-StockUI-v1.0.1
          path: dist/
          if-no-files-found: error
  publish:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: LINK4BRICK-StockUI-v1.0.1
          path: dist
      - name: Recheck release assets
        working-directory: dist
        run: |
          sha256sum -c SHA256SUMS
          unzip -t LINK4BRICK-StockUI-v1.0.1.zip
      - name: Publish stable LINK4BRICK v1.0.1
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const repo = context.repo;
            const tag = 'v1.0.1';
            const body = fs.readFileSync('RELEASE_NOTES.md', 'utf8');
            let release;
            try { release = (await github.rest.repos.getReleaseByTag({...repo, tag})).data; }
            catch (e) { if (e.status !== 404) throw e; }
            if (release && !release.draft) {
              core.info('Stable release already published; leaving it unchanged.');
              return;
            }
            if (release && release.target_commitish !== context.sha)
              throw new Error('Draft belongs to another commit; refusing to overwrite.');
            if (!release) release = (await github.rest.repos.createRelease({
              ...repo, tag_name: tag, target_commitish: context.sha,
              name: 'LINK4BRICK v1.0.1 — StockUI', body, draft: true, prerelease: false
            })).data;
            const assets = (await github.rest.repos.listReleaseAssets({...repo, release_id: release.id})).data;
            for (const name of ['LINK4BRICK-StockUI-v1.0.1.zip','LINK4BRICK-v1.0.1-source.tar.gz','install_link4brick.py','SHA256SUMS']) {
              if (assets.some(a => a.name === name)) throw new Error('Draft asset already exists: '+name);
              const data = fs.readFileSync('dist/'+name);
              await github.rest.repos.uploadReleaseAsset({
                ...repo, release_id: release.id, name, data,
                headers: {'content-type': name.endsWith('.zip') ? 'application/zip' : name.endsWith('.gz') ? 'application/gzip' : 'text/plain', 'content-length': data.length}
              });
            }
            await github.rest.repos.updateRelease({...repo, release_id: release.id, body, draft: false, prerelease: false, make_latest: 'true'});
